# gitleaks 配置：在默认规则上追加 allowlist。
# 新增或修改 allowlist 条目必须安全官审；只写位置和规则名，不写密钥值。
# 条目一律按「规则 + 文件 + 精确值」同时匹配才放行（AND），不按 commit 放行；
# 之后改到这些行或写入其他值仍会重新报出。

[extend]
useDefault = true

[[allowlists]]
description = "开发默认值：未配置 MUGSUN_API_KEY 时的本地回落值，生产 strict-keys 拒绝启动（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^mugsun-starter-web/src/main/java/com/mugsun/core/web/crypto/ApiCryptoService\.java$''']
regexTarget = "secret"
regexes = [
  '''^mugsun\-api\-key16$''',
]

[[allowlists]]
# K1 跨端互通的公开测试向量（api-crypto-vectors.json），不是真实密钥。
# 禁止放入真实密钥：path 与向量值同时匹配才放行（AND），同文件里的其他值仍会报。
# 值取自已发布向量本身，整串精确匹配；新增向量须安全官审后追加。
# 为 fix/crypto-no-builtin-key 将来合入 main 提前准备（generic-api-key）。
description = "K1 公开测试向量 api-crypto-vectors.json，非真实密钥（generic-api-key）"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^mugsun-starter-web/src/test/resources/crypto/api-crypto-vectors\.json$''']
regexTarget = "secret"
regexes = [
  '''^00112233445566778899aabbccddeeff$''',
]
