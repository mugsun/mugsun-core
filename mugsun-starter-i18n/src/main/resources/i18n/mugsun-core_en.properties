# mugsun-core 自己返回给用户的提示语的英文翻译。键就是代码里的中文原文，要和代码一字不差。
# 一行里第一个等号左边整个是键，空格、冒号直接写。应用想换掉某一句，在自己的 i18n/messages_en.properties 里写同一个键。

# 统一返回码（ResultCode）
操作成功=Success
操作失败=Operation failed
请求未授权=Unauthorized
没有访问权限=Access denied
资源不存在=Resource not found
服务器内部异常=Internal server error

# 统一异常处理（mugsun-starter-web）
参数校验失败=Invalid request parameters
请求方法不允许=Request method not allowed

# 接口加解密（mugsun-starter-web）
请求体须为加密报文=The request body must be encrypted
缺少加密字段 encryptData=Missing encrypted field: encryptData
加密报文解密失败=Failed to decrypt the request body

# 唯一约束冲突（mugsun-starter-mybatis）
数据已存在，请勿重复提交=The data already exists. Please do not submit it again.

# 分布式锁（mugsun-starter-lock）
操作正在进行中，请稍后再试=The operation is in progress. Please try again later.
